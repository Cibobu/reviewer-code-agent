services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitguardian
      POSTGRES_PASSWORD: gitguardian
      POSTGRES_DB: gitguardian
    ports:
      # Host 5433 → container 5432 (avoids local PostgreSQL on 5432)
      - "${GITGUARDIAN_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${GITGUARDIAN_REDIS_PORT:-6380}:6379"

volumes:
  pgdata:
