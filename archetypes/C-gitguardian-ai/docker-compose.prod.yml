# Production: PostgreSQL + Redis bound to localhost only.
# Usage:
#   export GITGUARDIAN_DB_PASSWORD=your-strong-password
#   docker compose -f archetypes/C-gitguardian-ai/docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitguardian
      POSTGRES_PASSWORD: ${GITGUARDIAN_DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: gitguardian
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
